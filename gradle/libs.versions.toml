# Remove once on DAGP >= 3.18.0 (blocked by FindKotlinMagicTask OOM on CI):
# https://github.com/autonomousapps/dependency-analysis-gradle-plugin/issues/1724
kotlin-metadata-jvm = { module = "org.jetbrains.kotlin:kotlin-metadata-jvm", version.ref = "kotlin" }
app-distribution-gradle-plugin = { module = "com.google.firebase:firebase-appdistribution-gradle", version.ref = "appDistribution" }

