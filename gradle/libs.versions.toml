fragment = { module = "androidx.fragment:fragment-ktx", version.ref = "fragment" }
camerax = { module = "androidx.camera:camera-camera2", version.ref = "cameraX" }
camerax-view = { module = "androidx.camera:camera-view", version.ref = "cameraX" }
