# build tools
desugar-jdklibs = { module = "com.android.tools:desugar_jdk_libs", version.ref = "desugarJdkLibs" }
android-gradle-plugin = { module = "com.android.tools.build:gradle", version.ref = "androidGradlePlugin" }
